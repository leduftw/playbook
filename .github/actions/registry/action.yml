# Publishes a released version to its language registry (crates.io or NuGet).
#
# It runs as a job inside each repo's own .github/workflows/playbook.yml rather
# than inside the shared pipeline, because registries match trusted publishing
# against the workflow file that does the publishing. No token is stored: the
# job trades its GitHub identity for a short-lived registry key.
name: playbook registry
description: Publish a released version to crates.io or NuGet through trusted publishing.

inputs:
  sha:
    description: The commit the release was built from.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.sha }}
        persist-credentials: false
    - name: Read the release settings
      id: settings
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../../../bin/playbook" ci registry-info
    - name: Install Linux packages
      if: steps.settings.outputs.apt != ''
      shell: bash
      run: sudo apt-get update -q && sudo apt-get install -q -y --no-install-recommends ${{ steps.settings.outputs.apt }}
    - name: Set up Rust
      if: steps.settings.outputs.registry == 'crates-io'
      uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        toolchain: stable
    - name: Get a crates.io token
      if: steps.settings.outputs.registry == 'crates-io'
      id: crates
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
    - name: Set up .NET
      if: steps.settings.outputs.registry == 'nuget'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: ${{ steps.settings.outputs.global_json }}
        dotnet-version: ${{ steps.settings.outputs.global_json == '' && '10.0.x' || '' }}
    - name: Get a NuGet key
      if: steps.settings.outputs.registry == 'nuget'
      id: nuget
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ steps.settings.outputs.registry_user }}
    - name: Publish
      shell: bash
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
      run: python3 "$GITHUB_ACTION_PATH/../../../bin/playbook" ci registry --publish
