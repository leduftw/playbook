# Checks that a PR title starts with a capital letter, then plain words, with no
# "type:" prefix and no full stop. A title doesn't become the commit: whatever
# merges the PR gives the squash commit a lowercase first letter. Dependabot's
# titles are fixed in place ("npm(deps): bump x" becomes "Bump x").
name: title

on:
  workflow_call:

permissions:
  contents: read

jobs:
  title:
    name: title
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Check the PR title
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix='^[a-zA-Z]+(\([^)]*\))?!?: '
          if [[ "$AUTHOR" == "dependabot[bot]" ]]; then
            fixed="$TITLE"
            [[ "$fixed" =~ $prefix ]] && fixed="${fixed#"${BASH_REMATCH[0]}"}"
            fixed="$(printf '%s' "${fixed:0:1}" | tr '[:lower:]' '[:upper:]')${fixed:1}"
            if [[ "$fixed" != "$TITLE" ]]; then
              gh pr edit "$PR" --title "$fixed"
              TITLE="$fixed"
            fi
          fi
          problems=()
          [[ "$TITLE" =~ ^[A-Z] ]] || problems+=("start with a capital letter, such as Add, Fix or Remove")
          [[ "$TITLE" =~ \.$ ]] && problems+=("drop the full stop at the end")
          [[ "$TITLE" =~ $prefix ]] && problems+=("drop the \"type:\" prefix")
          if ((${#problems[@]})); then
            echo "::error title=PR title::\"$TITLE\" doesn't follow the PR title style"
            printf -- '- %s\n' "${problems[@]}"
            echo "For example: Fix Windows installer replacement"
            exit 1
          fi
          echo "\"$TITLE\" follows the PR title style"
